name: Render social card
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install matplotlib
      - run: python render_card.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add pepstracker_fixed/price-index-card.png pepstracker_fixed/og-image.png
          git diff --cached --quiet || git commit -m 'Render price-index social card'
          git push
