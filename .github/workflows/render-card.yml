name: Render social card
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Geist is the typeface the site itself loads. Pulling it from npm at
      # build time keeps ~1.4MB of binary fonts out of the repo; build_cover.py
      # falls back to system faces if this ever fails.
      - name: Fetch Geist
        run: |
          npm pack geist@1.7.2 --silent
          tar xzf geist-1.7.2.tgz
          mkdir -p .fonts
          cp -r package/dist/fonts/geist-sans .fonts/
          cp -r package/dist/fonts/geist-mono .fonts/
          ls .fonts/geist-sans/Geist-Black.ttf
      - run: pip install matplotlib pillow
      - run: python render_card.py
      - run: python build_cover.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add pepstracker_fixed/price-index-card.png pepstracker_fixed/og-image.png pepstracker_fixed/fb-cover.png
          git diff --cached --quiet || git commit -m 'Render social card + Facebook cover'
          git push
