name: Menu Sync
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python menu_sync.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add pepstracker_fixed
          git diff --cached --quiet || git commit -m 'Menu sync: one canonical menu on every page'
          git push
