name: PepsTracker Price Scraper
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log page changes without committing them"
        type: boolean
        default: false
      regen_only:
        description: "Skip the scraper; just rebuild generated pages from current data"
        type: boolean
        default: false
      history_rebuild:
        description: "One-time: rebuild price-history.json from the full git history"
        type: boolean
        default: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 300  # 5h. Real work is ~2h; headroom for slow vendor sites.
    # GitHub-hosted runners cap a single job at 6h, so 300 is within limits.
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # The rebuild walks every past commit of index.html so it needs the
          # full log. Normal runs only append today and stay shallow.
          # NB: quote these. In GitHub expressions `x && 0 || 1` always
          # yields 1, because 0 is falsy and short-circuits to the || branch.
          fetch-depth: ${{ inputs.history_rebuild && '0' || '1' }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install requests playwright
          python -m playwright install chromium
          sudo apt-get install -y libglib2.0-0 libnss3 libnspr4 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxcb1 libxkbcommon0 libatspi2.0-0 libx11-6 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64
      # Skipped on a dry run so "dry run" means no writes at all —
      # the scraper commits index.html, which is not dry.
      - name: Run scraper
        if: ${{ !inputs.dry_run && !inputs.regen_only }}
        env:
          GITHUB_TOKEN: ${{ secrets.SCRAPER_GITHUB_TOKEN }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          GLACIER_EMAIL: ${{ secrets.GLACIER_EMAIL }}
          GLACIER_PASSWORD: ${{ secrets.GLACIER_PASSWORD }}
          MILEHIGH_EMAIL: ${{ secrets.MILEHIGH_EMAIL }}
          MILEHIGH_PASSWORD: ${{ secrets.MILEHIGH_PASSWORD }}
          ATOMIK_EMAIL: ${{ secrets.ATOMIK_EMAIL }}
          ATOMIK_PASSWORD: ${{ secrets.ATOMIK_PASSWORD }}
        run: python scraper.py

      # Gate: if the scrape produced data that looks wrong (all vial sizes at
      # one price, a bigger vial cheaper than a smaller one, listings under a
      # vendor that is not in VENDORS) fail here so the bad numbers are not
      # propagated into the ~380 generated static pages below.
      # Note: scraper.py commits index.html itself, so a failure here means the
      # raw data landed but nothing was built on top of it. Fix, then re-run.
      - name: Audit prices
        run: python audit_prices.py

      # Append one point per compound to price-history.json. Runs after the
      # audit so a day whose data was wrong never enters the series.
      # continue-on-error: the series is a nice-to-have; never let it block the
      # scrape or the page rebuild.
      - name: Record price history
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SCRAPER_GITHUB_TOKEN }}
        run: |
          set -e
          if [ "${{ inputs.history_rebuild }}" = "true" ]; then
            # belt and braces: the rebuild needs full history
            git rev-parse --is-shallow-repository | grep -q true && git fetch --unshallow || true
            python build_price_history.py --rebuild
          else
            python build_price_history.py
          fi
          if [ -z "$(git status --porcelain pepstracker_fixed/price-history.json)" ]; then
            echo "no history change"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pepstracker_fixed/price-history.json
          git commit -m "Record price history $(date -u +%Y-%m-%d)"
          # scraper.py pushes via the API earlier in this job, so local HEAD is
          # behind by then. Rebase before pushing.
          git pull --rebase --autostash \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

      # Rebuild the cheapest-* pages from the PRICES data the scraper just
      # committed, so the static snapshots never drift from the live tracker.
      - name: Regenerate price pages
        env:
          GITHUB_TOKEN: ${{ secrets.SCRAPER_GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python regenerate_pages.py
