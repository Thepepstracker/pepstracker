name: Sync site counts

# Generated pages bake in "all N vendors" phrasing. This re-syncs those
# site-wide phrases to the real VENDORS count in index.html.
# Always run with dry_run first and read the log before applying.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report changes without committing"
        type: boolean
        default: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # sync_dictionary.py imports regenerate_pages.py, which imports requests.
      - name: Install deps
        run: pip install requests

      # Restores punctuation that was destroyed by a bad-codec read (U+FFFD).
      # Runs FIRST: regenerate_pages.py matches on "·", so corrupted pages are
      # invisible to it until this repair lands.
      - name: Repair encoding damage
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python repair_encoding.py

      - name: Sync counts
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python sync_site_counts.py

      # Rewrites peptides/*.html: vendor counts (from the same rank_vendors the
      # price pages use), compound names, and meta descriptions.
      - name: Sync dictionary pages
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python sync_dictionary.py

      # "You are here" nav highlight on hand-written pages.
      - name: Nav active state
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python nav_active.py

      # One logo everywhere. Runs before the sitemap step only so the report
      # order reads sensibly; it touches nothing the other steps depend on.
      - name: Normalise logo
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python fix_logo.py

      # Runs LAST: it rebuilds the sitemap from whatever the steps above left
      # on disk, so it must see their noindex/canonical/title edits.
      - name: SEO hygiene
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python seo_hygiene.py

      - name: Show diff stat
        if: ${{ !inputs.dry_run }}
        run: git --no-pager diff --stat

      - name: Commit
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Sync site-wide and dictionary-page vendor counts to match index.html"
            git push
          fi
